# Echo — Deploy to Cloudflare Workers
#
# This workflow builds the frontend and deploys the Worker to Cloudflare on every
# push to main (and on manual dispatch). It requires the following repository
# secrets (Settings → Secrets and variables → Actions):
#
#   CLOUDFLARE_API_TOKEN   Cloudflare API token with "Workers Scripts:Edit",
#                          "D1:Edit", and "Workers KV Storage:Edit" permissions.
#                          Create at: https://dash.cloudflare.com/profile/api-tokens
#                          (Template: "Edit Cloudflare Workers")
#
#   CLOUDFLARE_ACCOUNT_ID  Your Cloudflare account ID (found in Workers dashboard
#                          sidebar, or `wrangler whoami`).
#
#   ECHO_DB_ID             The D1 database ID. If you haven't created one yet,
#                          run `npx wrangler d1 create echo-db` locally once and
#                          paste the database_id here.
#
#   ECHO_PASSWORD          The initial login password (only used on first run;
#                          afterwards the password is stored in D1 and can be
#                          changed in the UI).
#
# After the first successful deployment, you can change the password from the
# Echo UI settings page — the secret is no longer needed.

name: Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      skip_db_init:
        description: 'Skip database schema initialization (if already initialized)'
        type: boolean
        default: false

# Cancel in-progress deployments for the same branch
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Inject D1 database_id into wrangler.toml
        env:
          ECHO_DB_ID: ${{ secrets.ECHO_DB_ID }}
        run: node scripts/prepare-wrangler.js

      - name: Initialize D1 schema (first run only)
        if: ${{ github.event.inputs.skip_db_init != 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute echo-db --remote --file=./schema.sql

      - name: Set PASSWORD secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ECHO_PASSWORD: ${{ secrets.ECHO_PASSWORD }}
        run: |
          if [ -z "$ECHO_PASSWORD" ]; then
            echo "Warning: ECHO_PASSWORD secret not set. Using default password from wrangler.toml."
            echo "Set the ECHO_PASSWORD secret in repository settings before first deploy."
          else
            echo "$ECHO_PASSWORD" | npx wrangler secret put PASSWORD
          fi

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Print deployment URL
        run: |
          echo "::notice::Echo deployed. Visit your Cloudflare Workers dashboard to find the URL,"
          echo "::notice::or check the deploy step output above."
